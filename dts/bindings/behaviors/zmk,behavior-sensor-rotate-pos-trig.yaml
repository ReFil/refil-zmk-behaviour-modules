description: Sensor rotate position trigger

compatible: "zmk,behavior-sensor-rotate-pos-trig"

properties:
  "#sensor-binding-cells":
    type: int
    required: true
    const: 0
  tap-ms:
    type: int
    default: 5
  pos-inc:
    type: int
    required: true
  pos-dec:
    type: int
    required: true